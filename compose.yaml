# Band 8.0 Practice trên máy chủ dùng chung với SaleCheckIn — nhưng dữ liệu HOÀN TOÀN RIÊNG.
#
# Không dùng PostgreSQL của SaleCheckIn: ứng dụng này ít người dùng và ghi nhẹ (lịch sử học, tiến độ
# từ vựng), nên một file SQLite trong volume riêng của chính nó là đủ — không tạo role, không tạo
# database, không đụng gì tới CSDL hay bản sao lưu của SaleCheckIn. Container chỉ đứng CHUNG MẠNG
# `salecheckin_default` để Caddy của SaleCheckIn tìm thấy nó qua bí danh `practice-app` và chuyển
# HTTPS vào (cổng 80/443 trên máy đã do Caddy của SaleCheckIn giữ) — giống hệt cách dịch vụ `dash`
# của tender-intelligence đang làm, không phải để chung CSDL.
#
#   bash deploy/docker-deploy.sh         # dựng và phát hành (quy trình đủ: docs/deploy.md)
#   docker compose ps
#   docker compose logs -f app
#
# `docker compose down` (không -v) an toàn. `docker compose down -v` sẽ xoá volume `practice_data`
# — tức là xoá sạch tài khoản và lịch sử học; chỉ làm khi thật sự muốn xoá hết.

name: practice-english

services:
  app:
    build: .
    image: practice-english:latest
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_FILE: /app/data/exams.db
    volumes:
      - practice_data:/app/data
    # Không mở cổng ra ngoài máy chủ: chỉ Caddy (cùng mạng salecheckin_default) gọi tới được.
    expose:
      - "3000"
    networks:
      default: {}
      lan:
        aliases:
          - practice-app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/exams/stats').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    # Trần cứng: máy chủ còn chạy website, CSDL và báo cáo của dự án khác.
    mem_limit: ${APP_MEM_LIMIT:-512m}
    cpus: ${APP_CPUS:-1}

networks:
  # Mạng của SaleCheckIn — chỉ để Caddy của nó định tuyến tới đây bằng tên `practice-app`.
  # Phải có sẵn (SaleCheckIn đang chạy) trước khi `up`. KHÔNG mang CSDL nào qua mạng này.
  lan:
    name: ${PRACTICE_NETWORK:-salecheckin_default}
    external: true

volumes:
  # Toàn bộ dữ liệu của app (database SQLite): tài khoản, đề, lịch sử học, tiến độ từ vựng.
  practice_data:
